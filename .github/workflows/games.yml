name: profile-games
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: profile-games
  cancel-in-progress: false
jobs:
  move:
    if: >-
      github.event.issue.user.type != 'Bot' &&
      (startsWith(github.event.issue.title, 'ttt|') || startsWith(github.event.issue.title, 'chess|'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install chess==1.11.2
      - id: game
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          COMMENT_FILE: ${{ runner.temp }}/comment.md
        run: python .github/scripts/game.py
      - if: steps.game.outputs.changed == 'true'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/games .github/games/state.json
          git commit -m "game move (#$ISSUE_NUMBER)"
          git push
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_FILE: ${{ runner.temp }}/comment.md
        run: |
          if [ -s "$COMMENT_FILE" ]; then gh issue comment "$ISSUE_NUMBER" -R "$GITHUB_REPOSITORY" --body-file "$COMMENT_FILE"; fi
          gh issue close "$ISSUE_NUMBER" -R "$GITHUB_REPOSITORY"
