name: profile-cards
on:
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["journal/**", ".github/scripts/**", ".github/workflows/snake.yml", "assets/icons/**"]
permissions:
  contents: write
concurrency:
  group: contribution-cat
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: build cat grid
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/cat_grid.py "${{ github.repository_owner }}" dist
      - name: collect public profile data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/profile_data.py "${{ github.repository_owner }}" dist/data.json
      - name: render dashboard cards
        run: python3 .github/scripts/render_cards.py dist/data.json assets/icons dist
      - name: push to output branch
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.svg data.json
          git commit -qm "profile cards"
          git push -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" output
