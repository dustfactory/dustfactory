name: contribution-cat
on:
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: contribution-cat
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: build cat grid
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/cat_grid.py "${{ github.repository_owner }}" dist
      - name: push to output branch
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cat-light.svg cat-dark.svg
          git commit -qm "contribution cat"
          git push -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" output
