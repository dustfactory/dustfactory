name: contribution-snake
on:
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: contribution-snake
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#111111&color_dots=#ebebe8,#c8c8c4,#9a9a96,#5c5c5a,#111111
            dist/snake-dark.svg?color_snake=#f0f0f0&color_dots=#161b22,#3a3d42,#6b6e73,#a8aaad,#f0f0f0
      - name: push to output branch
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snake-light.svg snake-dark.svg
          git commit -qm "contribution snake"
          git push -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" output
